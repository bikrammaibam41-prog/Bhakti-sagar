<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b260d">
<title>Bhakti Sagar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="om">ॐ</div>
  <div><h1>भक्ति सागर</h1><p>भक्ति में ही शक्ति है 🙏</p></div>
</header>
<main>
  <section class="welcome">
    <h2>जय श्री राम 🙏</h2>
    <p>अपने मन को भक्ति और शांति से भरें</p>
  </section>
  <label class="search"><span>⌕</span><input id="search" placeholder="भजन या भगवान खोजें..."></label>
  <h2 class="section-title">भक्ति संग्रह</h2>
  <div class="categories" id="categories"></div>
  <h2 class="section-title" id="listTitle">लोकप्रिय भजन</h2>
  <div id="songs" class="songs"></div>
  <section class="add">
    <h3>अपना भजन लिंक जोड़ें</h3>
    <p>किसी वैध/अनुमति प्राप्त MP3 या HTTPS audio stream का सीधा लिंक डालें।</p>
    <input id="songName" placeholder="भजन का नाम">
    <input id="songUrl" placeholder="https://.../song.mp3" inputmode="url">
    <button id="addSong">भजन जोड़ें</button>
  </section>
</main>
<footer>भक्ति सागर • प्रेम, शांति और भक्ति</footer>
<div class="player" id="player">
  <div><strong id="nowPlaying">कोई भजन नहीं चुना</strong><small>Bhakti Sagar Player</small></div>
  <audio id="audio" controls preload="none"></audio>
</div>
<script src="app.js"></script>
</body>
</html>
